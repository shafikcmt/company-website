# Office server deployment. Values come from .env next to this file
# (copy docker/env.internal.example or docker/env.production.example).
name: company-website

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hapl}
      POSTGRES_USER: ${POSTGRES_USER:-hapl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hapl}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hapl}
      # gunicorn serves /static and /media itself (no separate web server).
      SERVE_FILES: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3003}:8000"
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - staticfiles:/app/staticfiles

  # Cloudflare Tunnel for the public domain (humanaapparels.com). Runs only
  # when COMPOSE_PROFILES=tunnel and CLOUDFLARE_TUNNEL_TOKEN are set in .env;
  # its public hostnames point at http://web:8000. Kept separate from the
  # server's own cloudflared service (other sites, other Cloudflare account).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
  staticfiles:
